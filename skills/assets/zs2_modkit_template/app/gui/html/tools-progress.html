          <article class="panel tool-panel browser-panel wide-panel" data-tool-panel="progress" data-tool-section="title" data-tool-label="称号">

            <div class="row title-toolbar">
              <input id="titleSearch" type="search" placeholder="搜索称号名称或ID">
              <button id="titleUnlockAllBtn">全部解锁</button>
            </div>
            <div class="row compact-id-row">
              <label>
                <span>ID</span>
                <input id="titleId" type="text" inputmode="numeric" list="titleOptions" value="1">

              <button id="titleUnlockBtn">解锁选中</button>
              <button id="titleInfoBtn">刷新</button>
            </div>
            <div id="titleHint" class="hint"></div>
            <div id="titleList" class="catalog-list system-list"></div>
          </article>
