          <article class="panel tool-panel browser-panel wide-panel" data-tool-panel="baby" data-tool-section="skill" data-tool-label="技能">
            <div class="panel-title">宝宝技能 <span id="babySkillListCount" class="panel-count"></span></div>
            <div class="row skill-toolbar">
              <label>
                <span>宝宝ID</span>
                <input id="babyActorId" type="text" inputmode="numeric" list="babyOptions" placeholder="自动">
              </label>
              <input id="babySkillSearch" type="search" placeholder="搜索技能名称、ID或描述">
            </div>
            <div class="row skill-row baby-skill-editor-row">
              <label>
                <span>技能ID</span>
                <input id="babySkillId" type="text" inputmode="numeric" list="skillOptions" value="1890">
              </label>
              <label>
                <span>类型</span>
                <select id="babySkillMode">
                  <option value="auto">自动</option>
                  <option value="passive">被动</option>
                  <option value="action">主动/核心</option>
                </select>
              </label>
              <label>
                <span>学习点数</span>
                <input id="babyLearnSlots" type="number" min="0" step="1" placeholder="读取">
              </label>
              <label>
                <span>槽位</span>
                <input id="babyActionSlot" type="number" min="1" step="1" placeholder="追加">
              </label>
            </div>
            <div class="preset-row baby-actions">
              <button id="babySkillAddBtn">添加技能</button>
              <button id="babySkillForgetBtn">移除技能</button>
              <button id="babySlotsSetBtn">设定点数</button>
              <button id="babySlotsAddBtn">+1点数</button>
              <button id="babySkillClearPassiveBtn">清空被动</button>
              <button id="babyInfoBtn">刷新宝宝</button>
            </div>
            <div id="babyHint" class="hint"></div>
            <div id="babyState" class="hint"></div>
            <div id="babySkillList" class="catalog-list icon-list"></div>
          </article>

          <article class="panel tool-panel browser-panel wide-panel" data-tool-panel="baby" data-tool-section="list" data-tool-label="列表">
            <div class="panel-title">宝宝列表 <span id="babyMetric" class="panel-count"></span></div>
            <div id="babyList" class="catalog-list baby-list"></div>
          </article>

          <article class="panel tool-panel" data-tool-panel="catalog" data-tool-section="talent" data-tool-label="天赋点">
            <div class="panel-title">天赋点</div>
            <div class="metric" id="talentPointMetric">0</div>
            <div class="row talent-point-row">
              <label>
                <span>角色ID</span>
                <input id="talentActorId" type="text" inputmode="numeric" list="actorOptions" value="1">
              </label>
              <label>
                <span>点数</span>
                <input id="talentPointValue" type="number" min="0" step="1" value="10">
              </label>
              <label>
                <span>类型</span>
                <select id="talentPointMode">
                  <option value="sp">通用天赋</option>
                  <option value="csp">职业天赋</option>
                </select>
              </label>
              <label>
                <span>职业槽</span>
                <input id="talentCspId" type="number" min="0" step="1" placeholder="自动">
              </label>
            </div>
            <div class="preset-row talent-actions">
              <button id="talentPointSetBtn">设定</button>
              <button id="talentPointAddBtn">增加</button>
              <button id="talentPointPartyAddBtn">全队增加</button>
              <button id="talentPointInfoBtn">刷新</button>
            </div>
            <div id="talentState" class="hint"></div>
          </article>
