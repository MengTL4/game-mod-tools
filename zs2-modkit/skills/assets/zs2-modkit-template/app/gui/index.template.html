<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' data: file:;">
  <title>再刷一把2 修改器</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/layout.css">
  <link rel="stylesheet" href="styles/catalog.css">
  <link rel="stylesheet" href="styles/feedback.css">
  <link rel="stylesheet" href="styles/responsive.css">
</head>
<body>
  <main class="shell">
    <header class="topbar command-topbar">
      <div class="brand-lockup">
        <div class="brand-mark" aria-hidden="true">ZS</div>
        <div>
          <div class="eyebrow">LOCAL RUNTIME BRIDGE</div>
          <h1>再刷一把2 修改器</h1>
        </div>
      </div>
      <div class="top-actions command-actions">
        <div id="statusPill" class="status status-idle">未连接</div>
        <button id="launchBtn" class="primary">启动游戏</button>
        <button id="refreshBtn" class="ghost">刷新</button>
      </div>
    </header>

    <section class="layout">
      <!-- @include html/sidebar.html -->

      <section class="workspace">
        <nav class="tool-nav" aria-label="修改器功能分组">
          <button class="active" data-tool-tab="core"><span data-nav-label class="nav-label">常用</span><span data-nav-hint class="nav-hint">金币 / 战斗 / 存档</span></button>
          <button data-tool-tab="catalog"><span data-nav-label class="nav-label">物品角色</span><span data-nav-hint class="nav-hint">物品 / 角色 / 技能</span></button>
          <button data-tool-tab="baby"><span data-nav-label class="nav-label">宝宝</span><span data-nav-hint class="nav-hint">技能 / 列表</span></button>
          <button data-tool-tab="progress"><span data-nav-label class="nav-label">成长解锁</span><span data-nav-hint class="nav-hint">称号 / 换装</span></button>
          <button data-tool-tab="offline"><span data-nav-label class="nav-label">脱机挂机</span><span data-nav-hint class="nav-hint">地图 / 敌群</span></button>
          <button data-tool-tab="world"><span data-nav-label class="nav-label">地图事件</span><span data-nav-hint class="nav-hint">传送 / 公共事件</span></button>
          <button data-tool-tab="misc"><span data-nav-label class="nav-label">杂项</span><span data-nav-hint class="nav-hint">变量 / 开关 / 图鉴</span></button>
          <button data-tool-tab="debug"><span data-nav-label class="nav-label">调试</span><span data-nav-hint class="nav-hint">JSON 命令</span></button>
        </nav>
        <nav id="toolSectionNav" class="tool-section-nav" aria-label="当前分类"></nav>
        <section class="tool-grid">
          <!-- @include html/tools-core-gold.html -->
          <!-- @include html/tools-misc-lookups.html -->
          <!-- @include html/tools-catalog-editors.html -->
          <!-- @include html/tools-baby.html -->
          <!-- @include html/tools-progress.html -->
          <!-- @include html/tools-offline.html -->
          <!-- @include html/tools-world.html -->
          <!-- @include html/tools-core-actions.html -->
        </section>

        <!-- @include html/events.html -->
      </section>
    </section>
  </main>


  <!-- @include html/datalists.html -->

  <div id="toast" class="toast"></div>
  <script src="app.js"></script>
</body>
</html>
